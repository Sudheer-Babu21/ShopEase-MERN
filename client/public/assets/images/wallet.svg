  <text x="200" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">RFID-Blocking Genuine Leather</text>
